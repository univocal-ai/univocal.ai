<style>
  :root {
    --paper: #FFFFFF;
    --ink: #071F45;
    --slate: #5A6478;
    --line: #E4E8EF;
    --focus: #005FF1;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #071F45;
      --ink: #EEF2F8;
      --slate: #9EAAC0;
      --line: #1F3560;
      --focus: #5C9DFF;
    }
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--paper);
    color: var(--ink);
    font-family: "Outfit", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 18px;
    line-height: 1.5;
  }
  a { color: inherit; }
  a:focus-visible {
    outline: 3px solid var(--focus);
    outline-offset: 4px;
    border-radius: 999px;
  }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 64px 20px 48px;
  }

  /* The official lockup, drawn from the logo's own vector paths */
  h1 { margin: 0; line-height: 0; }
  .lockup { display: block; width: min(640px, 88vw); height: auto; overflow: visible; }
  .lockup .wordmark { fill: var(--ink); }

  /* One movement on load: the three pieces of the symbol come together */
  .piece, .wordmark { transform-box: fill-box; opacity: 0; }
  .piece { animation: settle 1.1s cubic-bezier(.2, .8, .2, 1) forwards; }
  .piece.blue      { --from: translate(-26%, -4%); animation-delay: .15s; }
  .piece.violet    { --from: translate(26%, -4%);  animation-delay: .3s; }
  .piece.turquoise { --from: translate(0, 40%);    animation-delay: .45s; }
  .wordmark { animation: rise .8s ease .95s forwards; }
  @keyframes settle {
    from { opacity: 0; transform: var(--from); }
    to   { opacity: 1; transform: translate(0, 0); }
  }

  .soon {
    margin: clamp(28px, 4vw, 40px) 0 40px;
    font-size: clamp(19px, 2vw, 24px);
    color: var(--slate);
    opacity: 0;
    animation: rise .8s ease 1.15s forwards;
  }
  .button {
    display: inline-flex;
    align-items: center;
    padding: 13px 26px;
    border-radius: 999px;
    border: 1.5px solid var(--ink);
    background: var(--ink);
    color: var(--paper);
    font: inherit;
    font-size: 17px;
    font-weight: 500;
    text-decoration: none;
    transition: background-color .15s ease, color .15s ease;
    opacity: 0;
    animation: rise .8s ease 1.35s forwards;
  }
  .button:hover { background: transparent; color: var(--ink); }
  @keyframes rise {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    .piece, .wordmark, .soon, .button { animation: none; opacity: 1; transform: none; }
  }

  footer {
    border-top: 1px solid var(--line);
    padding: 22px 20px 28px;
    font-size: 15px;
    color: var(--slate);
  }
  footer .inner {
    width: min(1080px, 100%);
    margin-inline: auto;
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    gap: 8px 24px;
  }
  footer a { text-underline-offset: 3px; }
  footer a:hover { color: var(--ink); }
</style>
